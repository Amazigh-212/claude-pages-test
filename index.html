<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test GitHub Pages</title>
<style>
  :root { --bg: #f7f5f0; --fg: #1d1d1b; --accent: #c2410c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161615; --fg: #ecebe6; --accent: #fb923c; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: var(--bg); color: var(--fg); font: 18px/1.5 system-ui, sans-serif; padding: 16px; }
  main { max-width: 520px; text-align: center; }
  h1 { margin: 0 0 .5em; font-size: 2rem; }
  span { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Ça marche <span>✓</span></h1>
  <p>Ce site a été publié sur GitHub Pages par Claude avec <code>/deploy-pages</code>.</p>
  <p id="d"></p>
</main>
<script>document.getElementById('d').textContent = 'Page chargée le ' + new Date().toLocaleString('fr-FR');</script>
</body>
</html>
